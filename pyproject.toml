[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "trie"
dynamic = ["version"]
description = "Python implementation of the Ethereum Trie structure"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    { name = "The Ethereum Foundation", email = "snakecharmers@ethereum.org" },
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
maintainers = [
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
keywords = ["ethereum", "blockchain", "evm", "trie", "merkle"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "eth-hash>=0.1",
    "eth-utils>=2",
    "eth-typing>=6.0,<7",
    "hexbytes>=2",
    "rlp>=5",
    "sortedcontainers>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/py-trie"
Repository = "https://github.com/ApeWorX/py-trie.git"
Issues = "https://github.com/ApeWorX/py-trie/issues"
Changelog = "https://github.com/ApeWorX/py-trie/blob/main/CHANGELOG.rst"

[dependency-groups]
test = [
    "eth-hash>=0.1.0,<1.0.0",
    "hypothesis>=6.56.4,<7",
    "pycryptodome",
    "pytest>=7.0.0",
    "pytest-xdist>=2.4.0",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.18.2",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = [
    "towncrier>=24,<25",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "ipython",
    "prek",
]

[tool.setuptools.packages.find]
include = ["trie", "trie.*"]
exclude = ["scripts", "scripts.*", "tests", "tests.*"]

[tool.setuptools.package-data]
trie = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "3.1.0"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
ignore_missing_imports = true
strict_equality = true
strict_optional = true
warn_redundant_casts = false
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
testpaths = ["tests"]
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".mypy_cache",
    ".project-template",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "fixtures",
    "venv*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "D2",
    "D3",
    "D4",
]
ignore = [
    "D200",
    "D203",
    "D204",
    "D205",
    "D212",
    "D400",
    "D401",
    "D412",
    "D415",
]
per-file-ignores = { "__init__.py" = ["F401"], "trie/smt.py" = ["E501"], "trie/typing.py" = ["UP007"] }

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["trie"]
extra-standard-library = ["pytest"]
force-to-top = ["pytest"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mdformat]
number = true
